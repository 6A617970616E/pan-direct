name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check version consistency
        run: npm run version:check

      - name: Verify generated root manifest and provider registry are in sync
        run: |
          npm run sync-root
          git diff --exit-code manifest.json providers/index.js providers/popup-index.js

      - name: Run test suite
        run: npm test

      - name: Build Store and Community artifacts
        run: npm run build

  browser:
    name: DNR rule matrix (real Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies (Playwright)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run DNR scenario matrix
        run: npm run test:browser
